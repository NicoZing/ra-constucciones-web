# Include inside the server { } block of raconstrucciones.es (HTTPS)
server_tokens off;
autoindex off;
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
location ~ /\.(?!well-known) { deny all; }
add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-F9fHlw4RW0uA9ELNkxXtVu/yVXS5M2FiyO2FibWkGjY='; style-src 'sha256-cEa/+OQZEllKTQ0lHqeQL96KHAGNJeqPeOuTDqPIvxk='; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; manifest-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
